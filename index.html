    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        // ============================
        // ✅ Perf: 动态资源加载器 + 缓存
        // ============================
        const ASSETS = {
          marked: "https://cdn.jsdelivr.net/npm/marked/marked.min.js",
          dompurify: "https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js",
          katexCss: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css",
          katexJs: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js",
          katexAutoRender: "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js",
          prismCss: "https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css",
          prismCore: "https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js",
          prismAutoloader: "https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js",
          prismLangPath: "https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/"
        };

        const _scriptPromises = window.__scriptPromises || (window.__scriptPromises = {});
        const _cssPromises = window.__cssPromises || (window.__cssPromises = {});

        function loadScriptOnce(src) {
          if (_scriptPromises[src]) return _scriptPromises[src];
          _scriptPromises[src] = new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.defer = true;
            s.onload = () => resolve(true);
            s.onerror = () => reject(new Error("Failed to load script: " + src));
            document.head.appendChild(s);
          });
          return _scriptPromises[src];
        }

        function loadCSSOnce(href) {
          if (_cssPromises[href]) return _cssPromises[href];

          // 已存在则直接 resolve
          const exists = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
            .some(l => l.href === href);
          if (exists) {
            _cssPromises[href] = Promise.resolve(true);
            return _cssPromises[href];
          }

          _cssPromises[href] = new Promise((resolve, reject) => {
            const l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = href;
            l.onload = () => resolve(true);
            l.onerror = () => reject(new Error("Failed to load css: " + href));
            document.head.appendChild(l);
          });
          return _cssPromises[href];
        }

        function runWhenIdle(fn, timeout = 1200) {
          if ("requestIdleCallback" in window) {
            return window.requestIdleCallback(fn, { timeout });
          }
          return window.setTimeout(fn, 0);
        }

        async function ensureMarked() {
          if (window.marked) return true;
          await loadScriptOnce(ASSETS.marked);
          return true;
        }

        async function ensureDOMPurify() {
          if (window.DOMPurify) return true;
          await loadScriptOnce(ASSETS.dompurify);
          return true;
        }

        async function ensurePrism() {
          if (window.Prism) return true;
          await loadCSSOnce(ASSETS.prismCss);
          await loadScriptOnce(ASSETS.prismCore);
          await loadScriptOnce(ASSETS.prismAutoloader);

          if (window.Prism?.plugins?.autoloader) {
            window.Prism.plugins.autoloader.languages_path = ASSETS.prismLangPath;
          }
          return true;
        }

        async function ensureKatex() {
          if (window.renderMathInElement && window.katex) return true;
          await loadCSSOnce(ASSETS.katexCss);
          if (!window.katex) await loadScriptOnce(ASSETS.katexJs);
          if (!window.renderMathInElement) await loadScriptOnce(ASSETS.katexAutoRender);
          return true;
        }

        function detectNeeds(body) {
          const needsCode = /```/.test(body);
          const needsMath = /\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/.test(body);
          return { needsCode, needsMath };
        }

        // ✅ Frontmatter 解析（兼容 \r\n）
        function parseFrontmatter(text) {
          const pattern = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
          const match = text.match(pattern);
          if (!match) return { meta: null, body: text };

          const yamlBlock = match[1];
          const body = match[2];
          const meta = {};

          yamlBlock.split(/\r?\n/).forEach(line => {
            const parts = line.split(":");
            if (parts.length >= 2) {
              const key = parts[0].trim();
              let value = parts.slice(1).join(":").trim().replace(/^['"](.*)['"]$/, "$1");
              if (value.startsWith("[") && value.endsWith("]")) {
                value = value.slice(1, -1).split(",").map(v => v.trim().replace(/^['"](.*)['"]$/, "$1"));
              }
              meta[key] = value;
            }
          });

          return { meta, body };
        }

        function protectMathSegments(text) {
          const segments = [];
          const makeToken = (index) => `MATHSEGMENTTOKEN${index}END`;

          let protectedText = text.replace(/\$\$[\s\S]+?\$\$/g, (match) => {
            const token = makeToken(segments.length);
            segments.push(match);
            return token;
          });

          protectedText = protectedText.replace(/\\\[[\s\S]+?\\\]/g, (match) => {
            const token = makeToken(segments.length);
            segments.push(match);
            return token;
          });

          protectedText = protectedText.replace(/\\\([\s\S]+?\\\)/g, (match) => {
            const token = makeToken(segments.length);
            segments.push(match);
            return token;
          });

          protectedText = protectedText.replace(/(^|[^\\])(\$[^$\n]+?\$)/gm, (match, prefix, math) => {
            const token = makeToken(segments.length);
            segments.push(math);
            return `${prefix}${token}`;
          });

          return { text: protectedText, segments };
        }

        function escapeHtmlText(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function restoreMathSegments(text, segments) {
          return segments.reduce((acc, segment, index) => {
            const token = `MATHSEGMENTTOKEN${index}END`;
            return acc.split(token).join(escapeHtmlText(segment));
          }, text);
        }

        // ✅ 文章缓存（提升点击进入速度）
        const ARTICLE_CACHE = window.__ARTICLE_CACHE__ || (window.__ARTICLE_CACHE__ = new Map());
        const ARTICLE_FETCH_PROMISES = window.__ARTICLE_FETCH_PROMISES__ || (window.__ARTICLE_FETCH_PROMISES__ = new Map());
        const ARTICLE_PARSE_VERSION = 4;

        async function fetchArticleRecord(filePath) {
          const normalizedPath = normalizeContentPath(filePath);
          if (!normalizedPath) throw new Error("No file path specified.");

          const cached = ARTICLE_CACHE.get(normalizedPath);
          if (cached?.body && cached.parseVersion === ARTICLE_PARSE_VERSION) return cached;

          if (ARTICLE_FETCH_PROMISES.has(normalizedPath)) return ARTICLE_FETCH_PROMISES.get(normalizedPath);

          const p = (async () => {
            const res = await fetch(normalizedPath, { cache: "no-cache" });
            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
            const text = await res.text();
            const { meta, body } = parseFrontmatter(text);
            const { needsCode, needsMath } = detectNeeds(body);

            const existing = ARTICLE_CACHE.get(normalizedPath) || {};
            const record = { ...existing, text, meta, body, needsCode, needsMath, parseVersion: ARTICLE_PARSE_VERSION };
            ARTICLE_CACHE.set(normalizedPath, record);
            return record;
          })().finally(() => {
            ARTICLE_FETCH_PROMISES.delete(normalizedPath);
          });

          ARTICLE_FETCH_PROMISES.set(normalizedPath, p);
          return p;
        }

        // ✅ 预热：首次 hover 就开始加载 Marked+DOMPurify（只触发一次）
        function warmReaderDeps() {
          ensureMarked().catch(() => {});
          ensureDOMPurify().catch(() => {});
        }

        function prefetchArticle(filePath) {
          const normalizedPath = normalizeContentPath(filePath);
          if (!normalizedPath) return;
          warmReaderDeps();
          fetchArticleRecord(normalizedPath).catch(() => {});
        }

        function normalizeContentPath(filePath) {
          if (!filePath || typeof filePath !== 'string') return '';
          if (/^(https?:)?\/\//.test(filePath)) return filePath;
          if (filePath.startsWith('public/')) return filePath;
          if (filePath.startsWith('data/')) return `public/${filePath}`;
          return filePath;
        }

        function hasReadableContent(filePath) {
          return !!normalizeContentPath(filePath);
        }

        function slugifyHeading(value) {
          return String(value || "section")
            .toLowerCase()
            .normalize("NFKD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9\u4e00-\u9fff\s-]/g, "")
            .trim()
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-") || "section";
        }

        function annotateHeadings(html) {
          const container = document.createElement("div");
          container.innerHTML = html;

          const seen = new Map();
          const headings = [];

          container.querySelectorAll("h1, h2, h3").forEach((node) => {
            const title = (node.textContent || "").trim();
            if (!title) return;

            const base = slugifyHeading(title);
            const count = seen.get(base) || 0;
            seen.set(base, count + 1);
            const id = count ? `${base}-${count + 1}` : base;

            node.id = id;
            headings.push({
              id,
              title,
              level: Number(node.tagName.replace("H", ""))
            });
          });

          return {
            html: container.innerHTML,
            headings
          };
        }

        function buildCourseIndex(discipline, course) {
          if (!course?.chapters) {
            return null;
          }

          return {
            type: "library-course",
            disciplineTitle: discipline?.title || "",
            courseTitle: course?.title || "",
            lessons: course.chapters.flatMap((chapter) =>
              (chapter.lessons || []).map((lesson) => ({
                ...lesson,
                chapterTitle: chapter.title,
                readable: hasReadableContent(lesson.filePath),
                filePath: normalizeContentPath(lesson.filePath)
              }))
            )
          };
        }

        function buildLibraryReadingItem(lesson, discipline, course) {
          return {
            ...lesson,
            filePath: normalizeContentPath(lesson.filePath),
            readingContext: buildCourseIndex(discipline, course)
          };
        }

        function getEntryArticlePath(entry) {
          return normalizeContentPath(entry?.formats?.article?.path || entry?.filePath);
        }

        function buildCollectionReadingItem(entry, editorial) {
          if (!entry) return null;
          const tracks = editorial?.tracks || [];
          const collections = editorial?.collections || [];
          const entries = editorial?.entries || [];
          const track = tracks.find((item) => item.id === entry.trackId);
          const collection = collections.find((item) => item.id === entry.collectionId);
          const collectionEntries = entries
            .filter((item) => item.collectionId === entry.collectionId && hasReadableContent(getEntryArticlePath(item)))
            .map((item) => ({
              ...item,
              readable: true,
              filePath: getEntryArticlePath(item),
              chapterTitle: item.kind || "Entry",
              sourceTab: "writing",
              trackTitle: track?.titleZh || track?.title || "",
              trackCode: track?.code || "",
              collectionTitle: collection?.title || ""
            }));

          return {
            ...entry,
            filePath: getEntryArticlePath(entry),
            sourceTab: "writing",
            trackTitle: track?.titleZh || track?.title || "",
            trackCode: track?.code || "",
            collectionTitle: collection?.title || "",
            readingContext: {
              type: "editorial-collection",
              disciplineTitle: track?.titleZh || track?.title || "",
              courseTitle: collection?.title || "",
              lessons: collectionEntries
            }
          };
        }

        const VALID_TABS = ["home", "writing", "collections", "resources", "about"];
        const LEGACY_TAB_ALIASES = { collections: "writing" };

        function parseLocationRoute() {
          const raw = window.location.hash.replace(/^#\/?/, "");
          if (!raw) return { tab: "home", filePath: "" };

          const [tabCandidate, action, encodedPath] = raw.split("/");
          const requestedTab = VALID_TABS.includes(tabCandidate) ? tabCandidate : "home";
          const tab = LEGACY_TAB_ALIASES[requestedTab] || requestedTab;
          const filePath = action === "read" && encodedPath
            ? normalizeContentPath(decodeURIComponent(encodedPath))
            : "";

          return { tab, filePath };
        }

        function routeHashFor(tab, item = null) {
          const safeTab = VALID_TABS.includes(tab) ? tab : "home";
          const filePath = normalizeContentPath(item?.filePath);
          if (filePath) return `#/${safeTab}/read/${encodeURIComponent(filePath)}`;
          return safeTab === "home" ? "#/" : `#/${safeTab}`;
        }

        function findReadingItemByPath(db, filePath, preferredTab) {
          const targetPath = normalizeContentPath(filePath);
          if (!targetPath) return null;

          const candidates = [];
          (db?.editorial?.entries || []).forEach((entry) => {
            if (hasReadableContent(getEntryArticlePath(entry))) {
              candidates.push({
                tab: "writing",
                item: buildCollectionReadingItem(entry, db.editorial)
              });
            }
          });
          [...(db?.tools?.latex || []), ...(db?.tools?.general || [])].forEach((item) => {
            if (hasReadableContent(item.filePath)) candidates.push({ tab: "resources", item });
          });

          const preferred = candidates.find(({ tab, item }) =>
            tab === preferredTab && normalizeContentPath(item.filePath) === targetPath
          );
          const fallback = candidates.find(({ item }) => normalizeContentPath(item.filePath) === targetPath);
          const match = preferred || fallback;

          return match
            ? { ...match.item, filePath: targetPath, sourceTab: match.tab }
            : { filePath: targetPath, sourceTab: preferredTab };
        }

        // --- 默认回退数据 (Backup Data) ---
        const DEFAULT_DB = {
            editorial: {
                positioning: {
                    eyebrow: "PERSONAL WEBSITE",
                    title: "Mathematics, Algorithms & AI",
                    statement: "这里记录数学、算法与 AI 中值得反复理解的问题：结论依赖怎样的结构，方法为何有效，又在什么条件下失效。",
                    principles: []
                },
                tracks: [],
                collections: [],
                entries: []
            },
            library: {
                disciplines: [
                    { id: "opt", title: "Optimization", icon: "layers", desc: "从凸性与最优性条件出发，理解一阶方法为什么有效。", count: "0 Courses" },
                    { id: "prob", title: "Probability", icon: "sigma", desc: "从随机变量与极限定理出发，理解不确定性如何形成可计算的结构。", count: "0 Courses" },
                    { id: "stat", title: "Statistics", icon: "bar-chart-3", desc: "围绕估计、检验与实验设计，理解证据能够支持多强的结论。", count: "0 Courses" },
                    { id: "rl", title: "Reinforcement Learning", icon: "gamepad-2", desc: "从 MDP、价值函数到策略优化，理解目标、估计与分布约束。", count: "0 Courses" },
                    { id: "ml", title: "Machine Learning Theory", icon: "infinity", desc: "从复杂度与泛化出发，追问学习算法为何能够超越训练样本。", count: "0 Courses" },
                    { id: "info", title: "Information Theory", icon: "radio-tower", desc: "从熵与相对熵出发，理解信息量、概率集中与高维几何。", count: "1 Course" },
                    { id: "diff", title: "Diffusion", icon: "sparkles", desc: "从潜变量模型、Score Matching 到 SDE，追踪生成目标之间的联系。", count: "1 Course" }
                ],
                courses: {
                    "opt": [],
                    "prob": [],
                    "stat": [],
                    "rl": [],
                    "ml": [],
                    "info": [{ title: "Information Theory", chapters: [{ title: "High-Dimensional Geometry", lessons: [{ id: "info_aep", title: "Typical Set & AEP", type: "note", filePath: "public/data/posts/typical_set.md", highlight: true }] }] }],
                    "diff": [{ title: "Diffusion Models: Theory to Practice", chapters: [{ title: "Foundations", lessons: [{ id: "diff_01", title: "VAE & ELBO", type: "note", filePath: "public/data/posts/vae_elbo.md" }] }] }]
                }
            },
            tools: {
                general: [],
                latex: [
                    { 
                        id: "short-note",
                        title: "Short Note",
                        desc: "极简模板，适合短篇推导、研究摘要与公开内容卡片。",
                        icon: "file-text",
                        tags: ["Cheatsheet", "TColorBox"],

      const lucide = window.lucide;
      if (!lucide || typeof lucide.createIcons !== "function") return false;

      // 用 data-lucide 的方式（最兼容，包括 tv-2 / arrow-right 这种 kebab-case）
      root.innerHTML = `<i data-lucide="${name}"></i>`;

      lucide.createIcons({
        root,
        attrs: {
          width: size,
          height: size,
          class: className || "",
          "stroke-width": strokeWidth
        }
      });

      return true;
    };

    // 先尝试一次
    if (renderOnce()) return;

    // 极端情况下（脚本还没就绪）做短暂重试，避免“首次渲染空白”
    let tries = 0;
    const timer = setInterval(() => {
      tries += 1;
      if (renderOnce() || tries >= 20) clearInterval(timer);
    }, 50);

    return () => clearInterval(timer);
  }, [name, size, strokeWidth, className]);

    <span
      ref={iconRef}
      style={{ display: "inline-flex", verticalAlign: "middle" }}
      {...props}
    />
  );

                    return;
                }

                    try {
                        const record = await fetchArticleRecord(filePath);
                        if (ignore) return;

                        // ✅ 如果已解析过 HTML，直接用缓存（秒开）

                            content: record.html,
                            frontmatter: record.meta,
                            loading: false,

                            headings: record.headings || []
                          });
                          return;

                        // ✅ 必需库（文章首次打开才加载）
                        await ensureMarked();
                        await ensureDOMPurify();
                        if (ignore) return;

                        const m = window.marked;
                        const renderer = new m.Renderer();

                        renderer.code = function(entry, langStr) {
                            let codeContent = '';
                            let codeLang = '';

                            if (typeof entry === 'object') {
                                codeContent = entry.text || '';
                                codeLang = entry.lang || 'text';
                            } else {
                                codeContent = entry || '';
                                codeLang = langStr || 'text';
                            }

                            const validLang = (codeLang || 'text').toLowerCase();
                            const buttonData = encodeURIComponent(codeContent);

                            const displayCode = codeContent
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                                .replace(/"/g, '&quot;')
                                .replace(/'/g, '&#039;');

                            return `
                                <div class="relative group my-8 rounded-lg bg-[#2d2d2d] overflow-hidden shadow-xl border border-stone-700">
                                    <div class="flex justify-between items-center px-4 py-2 bg-[#383838] border-b border-stone-600 select-none">
                                        <span class="text-xs font-mono text-stone-400 uppercase">${validLang}</span>
                                        <button class="copy-btn text-xs font-mono text-stone-400 hover:text-white transition-colors cursor-pointer" data-code="${buttonData}">
                                            Copy
                                        </button>
                                    </div>
                                    <pre class="!m-0 !p-4 overflow-x-auto !bg-[#2d2d2d]"><code class="language-${validLang} !text-gray-200 !font-mono !text-sm">${displayCode}</code></pre>
                                </div>

                          : html;

                        const restored = restoreMathSegments(clean, protectedMath.segments);
                        const annotated = annotateHeadings(restored);

                        // ✅ 写入缓存
                        ARTICLE_CACHE.set(filePath, { ...record, html: annotated.html, headings: annotated.headings, parseVersion: ARTICLE_PARSE_VERSION });

                        if (ignore) return;
                        setState({
                          content: annotated.html,
                          frontmatter: record.meta,
                          loading: false,
                          error: null,
                          needsCode: !!record.needsCode,
                          needsMath: !!record.needsMath,
                          headings: annotated.headings
                        });
                    } catch (err) {
                        if (!ignore) setState({
                          content: '',
                          frontmatter: null,
                          loading: false,
                          error: err?.message || String(err),
                          needsCode: false,
                          needsMath: false,
                          headings: []
                        });
                    }
                })();

            }, [item]);

            // ✅ 内容渲染后：lazy 图片、绑定 copy、空闲时加载 Prism/KaTeX 并处理
            useEffect(() => {
              let cancelled = false;

              if (state.loading || state.error || !state.content || !root) return;

              // 1) 图片 lazy-load
              root.querySelectorAll("img").forEach(img => {
                if (!img.getAttribute("loading")) img.setAttribute("loading", "lazy");
                img.decoding = "async";
              });

              // 2) Copy button（防重复绑定）
              const tryCopy = async (text) => {
                // clipboard API
                try {
                  await navigator.clipboard.writeText(text);
                  return true;
                } catch (e) {}

                // fallback
                try {
                  const ta = document.createElement("textarea");
                  ta.value = text;
                  ta.style.position = "fixed";
                  ta.style.opacity = "0";
                  ta.style.left = "-9999px";
                  document.body.appendChild(ta);
                  ta.focus();
                  ta.select();
                  const ok = document.execCommand("copy");
                  document.body.removeChild(ta);
                  return ok;
                } catch (e) {
                  return false;
                }

                    const original = btn.innerText;
                    btn.innerText = ok ? "Copied!" : "Copy failed";
                    btn.classList.toggle("text-emerald-400", ok);
                    btn.classList.toggle("text-red-300", !ok);

                      btn.innerText = original;

                  }

            }, [state.content, state.loading, state.error, state.needsCode, state.needsMath]);

            const courseIndex = ["library-course", "editorial-collection"].includes(item?.readingContext?.type) ? item.readingContext : null;

            const hasSidebar = state.headings.length > 0 || (courseIndex && courseIndex.lessons.length > 0);
            const indexCardClass = sectionSurfaceClass;

            const jumpToHeading = (id) => {

                              <button
                                key={issue.id}
                                type="button"
                                onClick={() => onRead(readingItem)}
                                onMouseEnter={() => prefetchArticle(issue.filePath)}

                                <span className="font-serif text-lg font-bold text-stone-800 group-hover:text-blue-900">{issue.title}</span>

                              <span className="font-mono text-[10px] uppercase tracking-[0.16em] text-stone-300">Planned</span>

                        </div>
                      </div>
                    </SectionPanel>

              </div>
            </SectionShell>

        };

        const Collections = ({ editorial, onRead, embedded = false }) => {
          const tracks = editorial?.tracks || [];
          const collections = editorial?.collections || [];
          const entries = editorial?.entries || [];
          const [selectedCollectionId, setSelectedCollectionId] = useState(null);

          const renderFormatAction = (entry, formatKey, format) => {
            if (!format) return null;
            const label = format.label || formatKey;
            if (formatKey === "article" && format.path) {
              const readingItem = buildCollectionReadingItem(entry, editorial);
              return (
                <button
                  key={formatKey}
                  type="button"
                  onClick={() => onRead(readingItem)}
                  onMouseEnter={() => prefetchArticle(format.path)}
                  onTouchStart={() => prefetchArticle(format.path)}
                  className="inline-flex items-center gap-2 rounded-full bg-stone-900 px-3.5 py-2 font-mono text-[10px] uppercase tracking-[0.16em] text-white transition-colors hover:bg-blue-900"
                >
                  <Icon name="book-open" size={13} /> {label}
                </button>
              );
            }

            const href = format.path || format.url;
            if (!href) return null;
            return (
              <a
                key={formatKey}
                href={href}
                target="_blank"
                rel="noopener noreferrer"
                className="inline-flex items-center gap-2 rounded-full border border-stone-200 bg-white px-3.5 py-2 font-mono text-[10px] uppercase tracking-[0.16em] text-stone-600 transition-colors hover:border-blue-900 hover:text-blue-900"
              >
                <Icon name={formatKey === "video" ? "play" : "file-text"} size={13} /> {label}
              </a>
            );
          };

          const getPublishedEntries = (collection) => (collection?.entryIds || [])
            .map((id) => entries.find((entry) => entry.id === id))
            .filter(Boolean);
          const trackIcons = { foundations: "sigma", algorithms: "workflow", systems: "network" };
          const selectedCollection = collections.find((collection) => collection.id === selectedCollectionId);

          if (!selectedCollection) {
            return (
              <SectionShell maxWidth="max-w-6xl" className={embedded ? "min-h-0" : ""}>
                <SectionHeader
                  eyebrow="Topics"
                  title="专题"
                  description="围绕概率与信息、策略优化、生成模型与世界模型展开的系列内容。"
                  aside={`${collections.length} topics · ${entries.length} notes`}
                />

                <div className="grid grid-cols-1 gap-7 md:grid-cols-2 lg:grid-cols-3">
                  {collections.map((collection) => {
                    const track = tracks.find((item) => item.id === collection.trackId);
                    const published = getPublishedEntries(collection);
                    const formatTypes = [...new Set(published.flatMap((entry) => Object.keys(entry.formats || {})))];
                    return (
                      <SectionPanel
                        key={collection.id}
                        onClick={() => setSelectedCollectionId(collection.id)}
                        onKeyDown={(event) => handleKeyboardActivation(event, () => setSelectedCollectionId(collection.id))}
                        role="button"
                        tabIndex={0}
                        className="group relative flex min-h-[23rem] cursor-pointer flex-col overflow-hidden p-8 text-left transition-all hover:-translate-y-1 hover:border-blue-900/30 hover:shadow-[0_26px_60px_rgba(30,58,138,0.09)]"
                      >
                        <div className="pointer-events-none absolute -right-10 -top-10 h-36 w-36 rounded-full bg-stone-50 transition-transform duration-700 group-hover:scale-[1.55] group-hover:bg-blue-50/80"></div>
                        <div className="absolute inset-x-8 top-0 h-px bg-gradient-to-r from-blue-200 via-stone-200 to-transparent"></div>
                        <div className="relative z-10 flex h-full flex-col">
                          <div className="mb-8 flex items-center justify-between">
                            <div className="flex h-12 w-12 items-center justify-center rounded-lg bg-stone-100 text-stone-600 transition-all duration-500 group-hover:scale-105 group-hover:bg-blue-900 group-hover:text-white">
                              <Icon name={trackIcons[collection.trackId] || "layers"} size={23} />
                            </div>
                            <span className="font-mono text-[10px] uppercase tracking-[0.18em] text-stone-400">{track?.code} · {track?.titleZh}</span>
                          </div>
                          <h2 className="mb-4 text-3xl font-serif font-bold leading-tight text-stone-900 transition-colors group-hover:text-blue-900">{collection.title}</h2>
                          <p className="mb-4 font-serif text-lg italic leading-relaxed text-stone-600">{collection.question}</p>
                          <p className="mb-8 flex-grow text-sm leading-relaxed text-stone-500">{collection.desc}</p>
                          <div className="flex items-center border-t border-stone-100 pt-4 font-mono text-[10px] uppercase tracking-[0.16em] text-stone-400">
                            <Icon name="book-open" size={13} className="mr-2" />
                            <span>{published.length} {published.length === 1 ? "entry" : "entries"}</span>
                            {formatTypes.length > 0 && <span className="ml-3 text-stone-300">{formatTypes.join(" · ")}</span>}
                            <span className="ml-auto text-blue-900/70 transition-transform group-hover:translate-x-1">→</span>
                          </div>
                        </div>
                      </SectionPanel>
                    );
                  })}
                </div>
              </SectionShell>
            );
          }

          const selectedTrack = tracks.find((item) => item.id === selectedCollection.trackId);
          const published = getPublishedEntries(selectedCollection);
          return (
            <SectionShell maxWidth="max-w-6xl" className={embedded ? "min-h-0" : ""}>
              <SectionBackButton label="Back to Writing" onClick={() => setSelectedCollectionId(null)} />
              <SectionHeader
                eyebrow={`${selectedTrack?.code || ""} · ${selectedTrack?.titleZh || "Collection"}`}
                title={selectedCollection.title}
                description={selectedCollection.question}
                aside={`${published.length} ${published.length === 1 ? "entry" : "entries"}`}
                className="mt-8"
              />

              <SectionPanel className="overflow-hidden">
                <div className="border-b border-stone-100 bg-stone-50/65 px-7 py-6 md:px-10">
                  <p className="max-w-3xl text-sm leading-relaxed text-stone-500">{selectedCollection.desc}</p>
                </div>
                <div className="divide-y divide-stone-100">
                  {published.map((entry) => (
                    <article key={entry.id} className="grid gap-5 px-7 py-7 md:grid-cols-[8rem_minmax(0,1fr)_auto] md:items-center md:px-10">
                      <div>
                        <div className="font-mono text-[10px] uppercase tracking-[0.18em] text-blue-900">{entry.kind}</div>
                        <div className="mt-2 font-serif text-sm italic text-stone-400">{entry.date}</div>
                      </div>
                      <div>
                        <h3 className="text-xl font-serif font-bold leading-snug text-stone-900 md:text-2xl">{entry.title}</h3>
                        <p className="mt-2 max-w-2xl text-sm leading-relaxed text-stone-500">{entry.desc}</p>
                      </div>
                      <div className="flex flex-wrap gap-2 md:max-w-[13rem] md:justify-end">
                        {Object.entries(entry.formats || {}).map(([formatKey, format]) => renderFormatAction(entry, formatKey, format))}
                      </div>
                    </article>
                  ))}
                </div>
              </SectionPanel>

            </SectionShell>
          );
        };

        const HomeV2 = ({ setActiveTab, onRead, editorial }) => {
          const positioning = editorial?.positioning || {};
          const featured = FEATURED_ENTRY_IDS
            .map((id) => (editorial?.entries || []).find((entry) => entry.id === id))
            .filter(Boolean)
            .map((entry) => buildCollectionReadingItem(entry, editorial));
          return (
            <>
              <Hero setActiveTab={setActiveTab} positioning={positioning} />
              {featured.length > 0 && (
                <SectionShell className="min-h-0 pb-10 pt-14 md:pb-16 md:pt-20">
                  <SectionHeader
                    eyebrow="Writing"
                    title="近期写作"
                    description="关于高维概率、策略优化与表示学习。"
                  />
                  <div className="grid grid-cols-1 gap-6 md:grid-cols-3">
                    {featured.map((item) => (
                      <SectionPanel
                        key={item.id}
                        onClick={() => onRead(item)}
                        onKeyDown={(event) => handleKeyboardActivation(event, () => onRead(item))}
                        role="button"
                        tabIndex={0}
                        className="group flex min-h-[19rem] cursor-pointer flex-col p-8 text-left transition-all duration-300 hover:-translate-y-1 hover:border-blue-900/25 hover:shadow-[0_26px_60px_rgba(30,58,138,0.09)]"
                      >
                        <div className="mb-9 flex items-center justify-between">

                        <h2 className="mb-4 text-2xl font-serif font-bold leading-tight text-stone-900 transition-colors group-hover:text-blue-900">{item.title}</h2>
                        <p className="mb-8 flex-grow text-sm leading-relaxed text-stone-500">{item.desc}</p>
                        <div className="border-t border-stone-100 pt-4 font-mono text-[11px] uppercase tracking-[0.18em] text-stone-500 transition-colors group-hover:text-blue-900">
                          Read <span className="ml-2 inline-block transition-transform group-hover:translate-x-1">→</span>
                        </div>
                      </SectionPanel>
                    ))}
                  </div>
                </SectionShell>
              )}
              <section className="bg-stone-900 text-white">
                <div className="max-w-6xl mx-auto px-6 py-14 md:py-18 grid gap-8 md:grid-cols-3">
                  {(positioning.principles || []).map((principle, index) => (
                    <div key={principle.label} className={`md:px-8 ${index > 0 ? "md:border-l md:border-white/10" : ""}`}>
                      <div className="mb-4 font-mono text-[10px] uppercase tracking-[0.26em] text-blue-300">{principle.label}</div>
                      <h2 className="mb-3 text-2xl font-serif font-bold">{principle.title}</h2>
                      <p className="text-sm leading-relaxed text-stone-400">{principle.desc}</p>
                    </div>
                  ))}
                </div>
              </section>
              <Collections editorial={editorial} onRead={onRead} embedded />
            </>
          );
        };

        // --- Library（✅ hover/touch 预取） ---
        const Library = ({ onRead, data }) => {
          const [selectedDiscipline, setSelectedDiscipline] = useState(null);

          if (!data || !data.disciplines || data.disciplines.length === 0) {
            return <div className="p-12 text-center text-stone-400">Library data is empty.</div>;
          }

          const visibleDisciplines = data.disciplines.filter((discipline) => {
            const courses = data.courses?.[discipline.id] || [];
            return courses.some((course) =>
              (course.chapters || []).some((chapter) =>
                (chapter.lessons || []).some((lesson) => hasReadableContent(lesson.filePath))
              )
            );
          });

          if (!selectedDiscipline) {
            return (
                <SectionShell>
                    <SectionHeader
                      eyebrow="Technical Library"
                      title="Library"
                      description="按问题与前置结构整理的技术笔记。每篇内容尽量交代假设、推导与适用边界。"
                      aside={`${visibleDisciplines.length} active disciplines`}
                    />
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {visibleDisciplines.map(d => (
                            <SectionPanel
                              key={d.id}
                              className="group relative w-full cursor-pointer overflow-hidden p-8 text-left transition-all hover:-translate-y-1 hover:border-blue-900/30 hover:shadow-[0_26px_60px_rgba(30,58,138,0.09)]"
                              onClick={() => setSelectedDiscipline(d.id)}
                              onKeyDown={(event) => handleKeyboardActivation(event, () => setSelectedDiscipline(d.id))}
                              role="button"
                              tabIndex={0}
                            >
                                <div className="pointer-events-none absolute -right-10 -top-10 h-36 w-36 rounded-full bg-stone-50 transition-transform duration-700 group-hover:scale-[1.55] group-hover:bg-blue-50/80"></div>
                                <div className="pointer-events-none absolute inset-x-10 bottom-0 h-16 bg-gradient-to-t from-blue-50/30 to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"></div>
                                <div className="absolute inset-x-8 top-0 h-px bg-gradient-to-r from-blue-200 via-stone-200 to-transparent"></div>
                                <div className="relative z-10">
                                    <div className="w-12 h-12 bg-stone-100 text-stone-600 rounded-lg flex items-center justify-center mb-6 transition-all duration-500 group-hover:scale-105 group-hover:bg-blue-900 group-hover:text-white"><Icon name={d.icon} size={24} /></div>
                                    <h3 className="text-2xl font-bold text-stone-900 mb-2 font-serif">{d.title}</h3>
                                    <p className="text-stone-500 mb-6">{d.desc}</p>
                                    <div className="flex items-center text-xs font-mono text-stone-400 uppercase tracking-wider">
                                      <Icon name="book-open" size={12} className="mr-2"/>
                                      {(data.courses?.[d.id] || []).reduce((total, course) => total + (course.chapters || []).reduce((chapterTotal, chapter) => chapterTotal + (chapter.lessons || []).filter((lesson) => hasReadableContent(lesson.filePath)).length, 0), 0)} Notes
                                      <span className="ml-auto text-blue-900/70 opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                                    </div>
                                </div>
                            </SectionPanel>
                        ))}
                    </div>
                </SectionShell>
            );
          }

          const courses = data.courses[selectedDiscipline] || [];
          const currentInfo = data.disciplines.find(d => d.id === selectedDiscipline);

          return (
              <SectionShell maxWidth="max-w-6xl">
                  <SectionBackButton label="Back to Library" onClick={() => setSelectedDiscipline(null)} />
                  <SectionHeader
                    eyebrow="Discipline"
                    title={currentInfo.title}
                    description={currentInfo.desc}
                    aside={`${courses.length} courses`}
                    className="mt-8"
                  />
                  <div className="space-y-12">
                      {courses.length > 0 ? courses.map((course, idx) => (
                          <SectionPanel key={idx} className="overflow-hidden">
                              <div className="bg-stone-50/80 px-8 py-6 border-b border-stone-100 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                                  <h3 className="font-serif font-bold text-2xl text-stone-900">{course.title}</h3>
                                  <span className="w-fit text-xs font-mono bg-white border border-stone-200 px-2.5 py-1 rounded-full text-stone-500 uppercase tracking-[0.18em]">Course {idx + 1}</span>
                              </div>
                              <div className="p-8">
                                  {course.chapters.filter((chapter) => (chapter.lessons || []).some((lesson) => hasReadableContent(lesson.filePath))).map((chapter, cIdx) => (
                                      <div key={cIdx} className="mb-8 last:mb-0">
                                          <div className="flex items-center gap-3 mb-4">
                                              <span className="text-xs font-bold text-blue-900 uppercase tracking-widest">{chapter.title}</span>
                                              <div className="h-px flex-1 bg-stone-200"></div>
                                          </div>
                                          <div className="grid gap-2">
                                              {chapter.lessons.filter((lesson) => hasReadableContent(lesson.filePath)).map(lesson => (
                                                  <div
                                                    key={lesson.id}
                                                    onMouseEnter={() => prefetchArticle(lesson.filePath)}
                                                    onTouchStart={() => prefetchArticle(lesson.filePath)}
                                                    onClick={() => hasReadableContent(lesson.filePath) && onRead(buildLibraryReadingItem(lesson, currentInfo, course))}
                                                    onKeyDown={(event) => handleKeyboardActivation(event, () => onRead(buildLibraryReadingItem(lesson, currentInfo, course)))}
                                                    role="button"
                                                    tabIndex={0}
                                                    className={`flex w-full items-center justify-between p-3 text-left rounded-lg group transition-colors border ${hasReadableContent(lesson.filePath) ? "cursor-pointer hover:bg-stone-50 border-transparent hover:border-stone-100" : "cursor-not-allowed border-stone-100 bg-stone-50/60 opacity-70"}`}
                                                  >
                                                      <div className="flex items-center gap-3">
                                                        <Icon name="file-text" size={18} className={lesson.highlight ? "text-blue-600" : "text-stone-300"}/>
                                                        <span className={`text-sm ${lesson.highlight ? "font-bold text-stone-900" : "text-stone-600"}`}>{lesson.title}</span>
                                                      </div>
                                                      <div className="flex items-center gap-2">
                                                        {!hasReadableContent(lesson.filePath) && <span className="text-[10px] font-bold text-stone-500 bg-stone-200 px-2 py-0.5 rounded-full">SOON</span>}
                                                        {lesson.highlight && <span className="text-[10px] font-bold text-white bg-blue-600 px-2 py-0.5 rounded-full">ESSENTIAL</span>}
                                                      </div>
                                                  </div>

                                          </div>
                                      </div>
                                  ))}
                              </div>
                          </SectionPanel>
                      )) : <div className="p-12 text-center border border-dashed border-stone-300 text-stone-400">Construction in progress...</div>}
                  </div>
              </SectionShell>
          );
        };

        // --- Papers（✅ hover/touch 预取） ---
        const Papers = ({ data, onRead }) => {
            const [selectedTheme, setSelectedTheme] = useState(null);

            if (!data || !data.themes) return <div className="p-12 text-center text-stone-400">No papers data loaded.</div>;

            const visibleThemes = data.themes.filter((theme) => (data.lists?.[theme.id] || []).some((item) => hasReadableContent(item.filePath)));

            if(!selectedTheme) return (
                <SectionShell maxWidth="max-w-6xl">
                    <SectionHeader
                      eyebrow="Reading Collections"
                      title="Paper Notes"
                      description="Curated readings with an emphasis on mechanisms, proof ideas, and what changes after reading."
                      aside={`${visibleThemes.length} active themes`}
                    />
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {visibleThemes.map(t => (
                            <SectionPanel key={t.id} onClick={() => setSelectedTheme(t.id)} onKeyDown={(event) => handleKeyboardActivation(event, () => setSelectedTheme(t.id))} role="button" tabIndex={0} className="group w-full cursor-pointer p-8 text-left transition-all hover:-translate-y-1 hover:border-blue-900/25">
                                <div className="flex items-center gap-3 mb-5">
                                    <div className="w-10 h-10 rounded-full border border-stone-200 bg-stone-50 flex items-center justify-center text-blue-900">
                                        <Icon name="book-open" size={18} />
                                    </div>
                                    <div className="h-px flex-1 bg-gradient-to-r from-stone-200 to-transparent"></div>
                                </div>
                                <div className="flex justify-between items-start mb-4">
                                    <h3 className="text-2xl font-serif font-bold text-stone-900 group-hover:text-blue-900 transition-colors">{t.title}</h3>
                                    <span className="font-mono text-xs text-stone-400 bg-stone-50 px-2.5 py-1 border border-stone-200 rounded-full">{(data.lists?.[t.id] || []).filter((item) => hasReadableContent(item.filePath)).length}</span>
                                </div>
                                <p className="text-sm text-stone-500 font-serif italic mb-8">{t.desc}</p>
                                <div className="flex items-center text-xs font-mono text-stone-400 uppercase tracking-widest group-hover:text-stone-900 transition-colors">
                                    View Collection <span className="ml-2">→</span>
                                </div>
                            </SectionPanel>
                        ))}
                    </div>
                </SectionShell>
            );

            const list = (data.lists[selectedTheme] || []).filter((item) => hasReadableContent(item.filePath));
            const selectedThemeInfo = data.themes.find(t => t.id === selectedTheme);
            return (
                <SectionShell maxWidth="max-w-5xl">
                    <SectionBackButton label="Back to Papers" onClick={() => setSelectedTheme(null)} />
                    <SectionHeader
                      eyebrow="Selected Theme"
                      title={selectedThemeInfo?.title || "Papers"}
                      description={selectedThemeInfo?.desc}
                      aside={`${list.length} papers`}
                      className="mt-8"
                    />

                    <SectionPanel className="overflow-hidden divide-y divide-stone-100">
                        {list.length > 0 ? list.map((p, i) => (
                            <div
                              key={i}
                              onMouseEnter={() => prefetchArticle(p.filePath)}
                              onTouchStart={() => prefetchArticle(p.filePath)}
                              onClick={() => hasReadableContent(p.filePath) && onRead({ ...p, filePath: normalizeContentPath(p.filePath) })}
                              onKeyDown={(event) => handleKeyboardActivation(event, () => onRead({ ...p, filePath: normalizeContentPath(p.filePath) }))}
                              role="button"
                              tabIndex={0}
                              className={`group relative w-full p-6 text-left transition-colors ${hasReadableContent(p.filePath) ? "cursor-pointer hover:bg-stone-50/70" : "cursor-not-allowed opacity-75"}`}
                            >
                                <div className="flex flex-col md:flex-row gap-4 justify-between">
                                    <div className="flex-grow pr-8">
                                        <h3 className="font-serif text-lg font-bold text-stone-800 group-hover:text-blue-900 transition-colors leading-snug mb-2">
                                            {p.title}
                                        </h3>
                                        <p className="text-xs font-mono text-stone-500 mb-3">{p.authors}</p>
                                        <div className="flex gap-2">
                                             {p.tags && p.tags.map(tag => <span key={tag} className="text-[10px] text-stone-400 uppercase tracking-wider border border-stone-100 px-1.5 py-0.5">{tag}</span>)}

        // --- About ---
        const About = () => (
            <SectionShell maxWidth="max-w-5xl" className="flex flex-col justify-center">
                <SectionHeader
                  eyebrow="About"
                  title="MIStatlE"
                  description="A personal site about mathematics, learning theory, reinforcement learning, and algorithms."
                  aside="Shanghai"
                />

                <SectionPanel className="overflow-hidden">
                    <div className="grid md:grid-cols-[1.45fr_0.85fr]">
                        <div className="p-8 md:p-12">
                            <p className="text-xl md:text-2xl font-serif text-stone-800 leading-relaxed">
                                你好，我是 MIStatlE。这里整理我在学习、研究与技术写作中真正读过、推过或做过的内容。
                            </p>
                            <div className="mt-8 space-y-5 text-base leading-8 text-stone-600">
                                <p>
                                    主题从数学与学习理论出发，也延伸到强化学习、算法与实现。我不会把它写成知识大全；一篇内容通常只回答一个具体问题，并尽量交代必要背景、关键推导和结论边界。
                                </p>
                                <p>
                                    内容会随着理解继续修改。如果某篇笔记对你有帮助，或你发现了错误，欢迎告诉我。
                                </p>
                            </div>
                        </div>

                        <aside className="border-t border-stone-100 bg-stone-50/70 p-8 md:border-l md:border-t-0 md:p-10">
                            <div className="font-mono text-[10px] uppercase tracking-[0.24em] text-blue-900">Current interests</div>
                            <ul className="mt-6 space-y-3 font-serif text-base text-stone-700">
                                <li>Mathematical foundations</li>
                                <li>Learning theory</li>
                                <li>Reinforcement learning</li>
                                <li>Algorithms</li>
                            </ul>

                            <div className="mt-10 border-t border-stone-200 pt-8">
                                <div className="font-mono text-[10px] uppercase tracking-[0.24em] text-stone-400">Email</div>
                                <a href="mailto:mistatle@163.com" className="mt-3 inline-block font-serif text-lg font-bold text-stone-900 transition-colors hover:text-blue-900">
                                    mistatle@163.com
                                </a>
                            </div>
                        </aside>
                    </div>
                </SectionPanel>
            </SectionShell>
        );

        // --- Posts（✅ hover/touch 预取） ---
        const Posts = ({ data, onRead }) => (
            <SectionShell maxWidth="max-w-5xl">
                 <SectionHeader
                   eyebrow="Selected Writings"
                   title="Journal"
                   description="Longer notes, essays, and fragments worth keeping."
                   aside={(data || []).filter((post) => hasReadableContent(post.filePath)).length > 0 ? `${(data || []).filter((post) => hasReadableContent(post.filePath)).length} entries` : "in progress"}
                 />

                 <SectionPanel className="overflow-hidden">
                     <div className="flex flex-col gap-0">
                         {(data || []).filter((post) => hasReadableContent(post.filePath)).length > 0 ? (data || []).filter((post) => hasReadableContent(post.filePath)).map((post, index) => (
                            <article
                               key={post.id}
                               onMouseEnter={() => prefetchArticle(post.filePath)}
                               onTouchStart={() => prefetchArticle(post.filePath)}
                               onClick={() => hasReadableContent(post.filePath) && onRead({ ...post, filePath: normalizeContentPath(post.filePath) })}
                               onKeyDown={(event) => hasReadableContent(post.filePath) && handleKeyboardActivation(event, () => onRead({ ...post, filePath: normalizeContentPath(post.filePath) }))}
                               role={hasReadableContent(post.filePath) ? "button" : undefined}
                               tabIndex={hasReadableContent(post.filePath) ? 0 : undefined}
                               className={`group flex flex-col md:flex-row gap-8 items-baseline px-8 py-8 transition-colors duration-500 ${index > 0 ? "border-t border-stone-100" : ""} ${hasReadableContent(post.filePath) ? "cursor-pointer hover:bg-stone-50/70" : "cursor-default opacity-80"}`}
                             >
                                 <div className="w-full md:w-1/4 flex flex-row md:flex-col justify-between md:justify-start gap-2">
                                    <span className="font-serif text-sm italic text-stone-500">{post.date}</span>
                                    <span className="font-mono text-[10px] font-bold text-blue-900 uppercase tracking-widest mt-1">{post.category}</span>
                                 </div>

                                 <div className="w-full md:w-3/4">
                                     <h3 className="text-3xl font-serif font-bold text-stone-900 mb-4 leading-tight group-hover:text-blue-900 transition-colors">
                                        {post.title}
                                     </h3>
                                     <p className="text-stone-600 font-light text-lg leading-relaxed mb-6 font-serif">
                                         {post.desc}
                                     </p>
                                     <div className="inline-flex items-center border-b border-transparent pb-0.5 text-xs font-mono font-bold uppercase tracking-widest text-stone-400 transition-colors group-hover:border-stone-900 group-hover:text-stone-900">
                                         Read Essay <span className="ml-2 transition-all group-hover:ml-3">→</span>
                                     </div>
                                 </div>
                             </article>
                         )) : <div className="text-stone-400 p-8">No posts loaded.</div>}
                     </div>
                 </SectionPanel>
            </SectionShell>
        );

        // --- Tools（✅ hover/touch 预取） ---
        const Tools = ({ data, onRead }) => {
            const generalTools = [
              ...(data.general || []),
              ...(data.lab || []).map((item) => ({ ...item, tags: item.tags || (item.language ? [item.language] : []) }))
            ];
            const latexTemplates = data.latex || [];

            const ToolCard = ({ item }) => {
                const isReadable = hasReadableContent(item.filePath);
                const cardProps = isReadable
                  ? {
                      as: "div",
                      onClick: () => onRead(item),
                      onKeyDown: (event) => handleKeyboardActivation(event, () => onRead(item)),
                      role: "button",
                      tabIndex: 0,
                      onMouseEnter: () => prefetchArticle(item.filePath),
                      onTouchStart: () => prefetchArticle(item.filePath)
                    }
                  : item.link
                    ? { as: "a", href: item.link, target: "_blank", rel: "noopener noreferrer" }
                    : { as: "div" };

                return (
                <SectionPanel
                  {...cardProps}
                  className="group relative flex h-full w-full cursor-pointer flex-col p-8 text-left transition-all duration-300 hover:-translate-y-1 hover:border-blue-900/25 hover:shadow-[0_26px_60px_rgba(30,58,138,0.09)]"
                >
                    {item.previewImage && (
                        <div className="mb-6 overflow-hidden rounded-[1.2rem] border border-stone-100 bg-stone-50 aspect-[4/5]">
                            <img
                              src={item.previewImage}
                              alt={`${item.title} preview`}
                              loading="lazy"
                              decoding="async"
                              className="w-full h-full object-cover object-top transition-transform duration-500 group-hover:scale-[1.02]"
                            />
                        </div>
                    )}

                    {item.link && (
                        <span className="absolute top-4 right-4 p-2 text-stone-300 transition-colors group-hover:text-blue-900" aria-hidden="true">
                            <Icon name="external-link" size={16} />
                        </span>
                    )}

                    <div className="mb-6 flex items-center justify-between">
                        <div className="w-12 h-12 bg-stone-50 rounded-lg flex items-center justify-center text-stone-400 group-hover:text-blue-900 group-hover:bg-blue-50 transition-colors">
                            <Icon name={item.icon || "box"} size={24}/>
                        </div>
                        {item.tags && (
                            <div className="flex gap-1">
                                {item.tags.map(t => (
                                    <span key={t} className="text-[10px] font-mono text-stone-400 border border-stone-100 px-1.5 py-0.5 rounded uppercase">{t}</span>
                                ))}
                                {item.previewImages && item.previewImages.length > 1 && (
                                    <span className="text-[10px] font-mono text-blue-900 border border-blue-100 bg-blue-50 px-1.5 py-0.5 rounded uppercase">
                                        {item.previewImages.length} Previews
                                    </span>
                                )}
                            </div>
                        )}
                    </div>

                    <h3 className="font-bold text-lg mb-2 text-stone-800 group-hover:text-blue-900 font-sans tracking-tight">
                        {item.title}
                    </h3>
                    <p className="text-sm text-stone-500 mb-8 flex-grow leading-relaxed font-light">
                        {item.desc}
                    </p>

                    <div className="mt-auto pt-4 border-t border-stone-100 flex items-center text-xs font-mono text-stone-500 uppercase tracking-wider group-hover:text-blue-900 transition-colors">
                        <span className="font-semibold">{item.filePath ? "Open Resource" : "Open Tool"}</span>
                        <span className="ml-2 group-hover:translate-x-1 transition-transform">→</span>
                    </div>
                </SectionPanel>
                );
            };

            return (
                <SectionShell>
                    <SectionHeader
                      eyebrow="Resources"
                      title="模板、代码与工具"
                      description="可以直接阅读、下载或复用的 LaTeX 模板、代码、PDF 与小型工具。"
                      aside={`${latexTemplates.length + generalTools.length} resources`}
                    />

                    <div className="mb-20">
                        <div className="flex items-center gap-3 mb-8">
                            <span className="font-mono text-[11px] uppercase tracking-[0.24em] text-blue-900">LaTeX Templates</span>
                            <div className="h-px flex-1 bg-stone-200"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {latexTemplates.length > 0 ? latexTemplates.map(t => (
                                <ToolCard key={t.id} item={t} />
                            )) : <div className="text-stone-400 italic p-4 border border-dashed border-stone-200 w-full">资源正在整理中。</div>}
                        </div>
                    </div>

                    {generalTools.length > 0 && <div>
                        <div className="flex items-center gap-3 mb-8">
                            <span className="font-mono text-[11px] uppercase tracking-[0.24em] text-stone-400">Code & Utilities</span>
                            <div className="h-px flex-1 bg-stone-200"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {generalTools.map(t => (
                                <ToolCard key={t.id} item={t} />
                            ))}
                        </div>
                    </div>}
                </SectionShell>
            );
        };

        // --- App（✅ 不再用全屏 loading 阻塞首屏；用 DEFAULT_DB 立即可渲染） ---
        const App = () => {
          const [activeTab, setActiveTab] = useState(() => parseLocationRoute().tab);
          const [readingItem, setReadingItem] = useState(null);
          const [db, setDb] = useState(DEFAULT_DB);

          useEffect(() => {
            const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
            window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
          }, [activeTab, readingItem]);

          useEffect(() => {
            if (readingItem?.title) {
              document.title = `${readingItem.title} | MIStatlE`;
              return;
            }
            const tabLabel = activeTab === "home"
              ? "Mathematics, Algorithms & AI"
              : ([...NAV_ITEMS, { id: "about", label: "About" }].find((item) => item.id === activeTab)?.label || "Archive");
            document.title = `MIStatlE | ${tabLabel}`;
          }, [activeTab, readingItem]);

          useEffect(() => {
            const syncRoute = () => {
              const route = parseLocationRoute();
              setActiveTab(route.tab);
              setReadingItem(route.filePath ? findReadingItemByPath(db, route.filePath, route.tab) : null);
            };

            window.addEventListener("hashchange", syncRoute);
            syncRoute();
            return () => window.removeEventListener("hashchange", syncRoute);
          }, [db]);

          useEffect(() => {
            const safeFetch = async (url) => {
                try {
                    const res = await fetch(url, { cache: "no-cache" });
                    if (!res.ok) throw new Error(res.statusText);
                    return { ok: true, url, data: await res.json() };
                } catch (e) {
                    console.error(`Load failed: ${url}`, e);
                    return { ok: false, url, error: e?.message || String(e) };
                }
            };

            Promise.all([
                safeFetch('public/data/editorial.json'),
                safeFetch('public/data/tools.json'),
                safeFetch('public/data/latex_templates.json')
            ]).then(([editorial, toolsData, latexData]) => {
                setDb(prev => ({
                    editorial: editorial.ok ? editorial.data : prev.editorial,
                    tools: {
                        general: toolsData.ok ? toolsData.data : prev.tools.general,
                        latex: latexData.ok ? latexData.data : prev.tools.latex
                    }
                }));
            });
          }, []);

          const navigateToTab = (tab) => {
            const nextHash = routeHashFor(tab);
            if (window.location.hash === nextHash) {
              setActiveTab(tab);
              setReadingItem(null);
              return;
            }
            window.location.hash = nextHash;
          };

          const openReadingItem = (item) => {
            const sourceTab = item?.sourceTab || activeTab || "writing";
            const normalizedItem = { ...item, filePath: normalizeContentPath(item?.filePath), sourceTab };
            const nextHash = routeHashFor(sourceTab, normalizedItem);
            if (window.location.hash === nextHash) {
              setActiveTab(sourceTab);
              setReadingItem(normalizedItem);
              return;
            }
            window.location.hash = nextHash;
          };

          const renderContent = () => {
            if (readingItem) return <ArticleReader item={readingItem} onBack={() => navigateToTab(activeTab)} onSelectItem={openReadingItem} />;

            switch(activeTab) {
              case 'home': return <HomeV2 setActiveTab={navigateToTab} onRead={openReadingItem} editorial={db.editorial} />;
              case 'writing': return <Collections editorial={db.editorial} onRead={openReadingItem} />;
              case 'resources': return <Tools data={db.tools} onRead={openReadingItem} />;
              case 'about': return <About />;
              default: return <HomeV2 setActiveTab={navigateToTab} onRead={openReadingItem} editorial={db.editorial} />;
            }
          };

          return (
            <div className="min-h-screen flex flex-col selection:bg-blue-900 selection:text-white">
              <Navbar activeTab={activeTab} setActiveTab={navigateToTab} />
              <main id="main-content" className="flex-grow">{renderContent()}</main>
              <footer className="bg-stone-50/90 border-t border-stone-200 py-12 mt-0 text-stone-400 text-xs font-mono">
                <div className="max-w-6xl mx-auto px-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                    <div>© {new Date().getFullYear()} MIStatlE</div>
                    <div className="uppercase tracking-[0.18em]">Structure · Mechanism · Boundary</div>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
